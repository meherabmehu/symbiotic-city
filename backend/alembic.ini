# Alembic configuration for the SYMBIOTIC CITY schema.
# The database URL is taken from the application settings (DATABASE_URL), so this
# file never contains credentials.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Revisions are auto-numbered with a date prefix for readability in review.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
