name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  postgres:
    name: Backend tests + migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: symbiotic
          POSTGRES_PASSWORD: symbiotic
          POSTGRES_DB: symbiotic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U symbiotic -d symbiotic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_TEST_URL: postgresql+psycopg2://symbiotic:symbiotic@localhost:5432/symbiotic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest psycopg2-binary
      # The migration is the deployment path; if it cannot build the schema on
      # PostgreSQL, the compose stack is broken. This job is the guard.
      - name: alembic upgrade on PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - name: Migration and parity tests
        working-directory: backend
        run: python -m pytest tests/test_migrations.py tests/test_postgres_parity.py -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The venv must sit at the repository root: playwright.config.ts launches
      # the API as ../.venv/bin/python from frontend/.
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Always upload: the JSON report is what makes a failure diagnosable from
      # the artifact alone, without access to the raw job log.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
